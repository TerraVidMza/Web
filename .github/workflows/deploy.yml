name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Inyecta la URL del backend desde los Secrets de GitHub para el bundle de producción
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Sin claves: GitHub entrega un token OIDC y Google lo cambia por uno de
      # la cuenta despliegue-firebase, que solo puede desplegar Hosting (W-030).
      - name: Autenticar contra Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: terravid
          workload_identity_provider: projects/286067019564/locations/global/workloadIdentityPools/github/providers/terravidmza
          service_account: despliegue-firebase@terravid.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15 deploy --only hosting --project terravid --non-interactive

      - name: Post-Deployment Health Check
        run: curl --retry 5 --retry-delay 3 --retry-all-errors -I -f https://terravid.web.app
