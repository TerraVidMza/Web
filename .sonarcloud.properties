# Configuracion de SonarCloud (modo "Automatic Analysis").
#
# Por que SonarCloud: el repositorio ya corre oxlint (lint rapido de
# TypeScript/React). SonarCloud suma analisis de seguridad (XSS, secretos,
# hotspots), duplicacion, deuda tecnica y una Quality Gate por rama y por PR.
# Es gratuito para repositorios publicos y no requiere servidor propio.
#
# En modo automatico SonarCloud clona el repo en cada push a main y en cada PR y
# lee este archivo. No hace falta workflow ni token.

# Codigo de la SPA. dist/, coverage/ y test-results/ son generados.
sonar.sources=src
# Tests unitarios (Vitest) junto al codigo, mocks de MSW y e2e de Playwright.
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**,e2e/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**

# Los componentes de src/components/ui los genera shadcn/ui y se copian tal
# cual: no se mantienen a mano, asi que su duplicacion no es deuda propia.
sonar.cpd.exclusions=src/components/ui/**

sonar.sourceEncoding=UTF-8
